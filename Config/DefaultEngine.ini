[SystemSettings]
; Ray-traced sun shadows: 1 sample per pixel left canopy shade and the heroine's clothes crawling
; with denoiser noise, worst while moving. 2 samples plus a wider history convolution bring static
; shade noise down to the Virtual Shadow Map level for about 0.7 ms at 1080p internal resolution
; (docs/research/rendering-baseline/README.md).
r.RayTracing.Shadows.SamplesPerPixel=2
r.Shadow.Denoiser.HistoryConvolutionSamples=16
; Full sun over the open estate meters at about EV 13.5, past the default's usable range (up to 12),
; which clipped Lumen's cached lighting and printed a warning on screen. 8 covers about [-4, 16],
; enough for moonlit nights and the bright coast.
r.EyeAdaptation.CachedLightingPreExposure=8

