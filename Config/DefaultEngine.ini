[SystemSettings]
; Ray-traced sun shadows: 1 sample per pixel left canopy shade and the heroine's clothes crawling
; with denoiser noise, worst while moving. 2 samples plus a wider history convolution bring static
; shade noise down to the Virtual Shadow Map level for about 0.7 ms at 1080p internal resolution
; (docs/research/rendering-baseline/README.md).
r.RayTracing.Shadows.SamplesPerPixel=2
r.Shadow.Denoiser.HistoryConvolutionSamples=16
; Full sun over the open estate meters at about EV 13.5, past the default's usable range (up to 12),
; which clipped Lumen's cached lighting and printed a warning on screen. 8 covers about [-4, 16],
; enough for moonlit nights and the bright coast.
r.EyeAdaptation.CachedLightingPreExposure=8
; Hair in the manor by day: the hair strands take their indirect light from Lumen's world-space radiance
; cache, which outside the near clipmap was about one probe a metre (2500 cm extent, grid 48) and so
; interpolated the bright yard through the half-metre manor walls: her chestnut hair read near-black or
; glowing white/gold by which way she faced (walls and skin use screen probes and were fine). 1000 cm puts
; a probe every ~42 cm near her; a fifth clipmap keeps the cache's reach at ~160 m (was ~200 m).
; Outdoors and at night her hair is unchanged (Props, 2026-10-01; E:\CopilotScratch\ce241dd6-...\hair).
r.Lumen.ScreenProbeGather.RadianceCache.ClipmapWorldExtent=1000
r.Lumen.ScreenProbeGather.RadianceCache.NumClipmaps=5

